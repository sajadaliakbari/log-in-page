<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home</title>
    <link rel="stylesheet" href="css/bootstrap-5.0.2-dist/css/bootstrap.css">
    <link rel="stylesheet" href="css/fontawesome-free-6.2.1-web/css/all.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="ocean">
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <section>
        <div class="container" id="container">
            <div class="form-container sign-up-container">
                <form action="#">
                    <h1>Sing Up</h1>
                    <div class="social-container">
                        <a href="https://github.com/sajadali" target="_blank" class="social"><i class="fa-brands fa-github"></i></a>
                        <a href="" target="_blank" class="social"><i class="fa-brands fa-codepen"></i></a>
                        <a href="mailto:sjdali@gmail.com" target="_blank" class="social"><i class="fa-brands fa-google"></i></a>
                    </div>
                    <span>Or use your Email for registration</span>
                    <label for="">
                        <input type="text" placeholder="Name">
                    </label>
                    <label for="">
                        <input type="email" placeholder="Email">
                    </label>
                    <label for="">
                        <input type="password" placeholder="Password">
                    </label>
                    <button  style="margin-top: 9px;">Sign Up</button>
                </form>
            </div>
            <div class="form-container sign-in-container">
                <form action="#">
                    <h1>Sign in</h1>
                    <div class="social-container">
                        <a href="https://github.com/sajadali" target="_blank" class="social"><i class="fa-brands fa-github"></i></a>
                        <a href="" target="_blank" class="social"><i class="fa-brands fa-codepen"></i></a>
                        <a href="mailto:sjdali@gmail.com" target="_blank" class="social"><i class="fa-brands fa-google"></i></a>
                    </div>
                    <span>Or sign in using E-mail Address</span>
                    <label for="">
                        <input type="email" placeholder="E-mail">
                    </label>
                    <label for="">
                        <input type="password" placeholder="Password">
                    </label>
                    <a href="#">Forgot your password</a>
                    <button>Sign In</button>
                </form>
            </div>
            <div class="overlay-container">
                <div class="overlay">
                    <div class="overlay-panel overlay-left">
                        <h1>Log in</h1>
                        <p>Sign in here if you already have an acount</p>
                        <button class="ghost mt-5 button" id="signIn">Sign In</button>
                    </div>
                    <div class="overlay-panel overlay-right">
                        <h1>Create, Account!</h1>
                        <p>Sign up if you still don't have an acount...</p>
                        <button class="ghost" id="signUp">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
<script src="css/bootstrap-5.0.2-dist/js/bootstrap.min.js"></script>
<script src="js/script.js"></script>
</body> 
</html>
